# Vulhub Workflow Add New Cve Environment

## Action

Follow the add-new-cve-environment workflow:
1. Create or update a base Dockerfile for the relevant software version (base/{software}/{version}/Dockerfile).
2. Add environment-specific files under {software}/{CVE}/ (e.g., images, README.md, README.zh-cn.md, docker-compose.yml, exploit or poc scripts).
3. Add supporting scripts or SQL files if needed (e.g., database/001_schema.sql, docker-entrypoint.sh).
4. Commit all files together.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: base/*/*/Dockerfile, */*/README.md, */*/README.zh-cn.md

